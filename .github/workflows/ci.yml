name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --no-editable
      - run: make check
      - run: uv run --no-editable context-lab demo --output-dir artifacts/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: context-reliability-demo
          path: artifacts/ci-demo
